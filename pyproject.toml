[project]
name = "houdini-mcp-server"
version = "0.1.0"
description = "MCP server giving Claude context-aware, read-only access to a live Houdini session"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastmcp>=3.4.0",
    "httpx>=0.28.0",
]

[project.scripts]
houdini-mcp = "server.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
